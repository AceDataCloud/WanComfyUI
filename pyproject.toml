[project]
name = "wan"
version = "0.1.1"
description = "Wan Dify-parity tools through Ace Data Cloud for ComfyUI"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "jsonschema>=4,<5"]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/AceDataCloud/WanComfyUI"
