"Bug Tracker" = "https://github.com/AceDataCloud/WanComfyUI/issues"

[tool.comfy]
PublisherId = "acedatacloud"
DisplayName = "Wan by Ace Data Cloud"
Icon = "https://raw.githubusercontent.com/AceDataCloud/WanComfyUI/main/assets/logo-400.png"
